apiVersion: v1
kind: Namespace
metadata:
  name: test-app-my-sql
  annotations: { "argocd.argoproj.io/sync-wave": "-5" }
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: test-app-my-sql
  annotations: { "argocd.argoproj.io/sync-wave": "-2" }
stringData:
  DB_USER: "testuser"
  DB_PASSWORD: "supersecretpassword123"
  DB_NAME: "testdb"
  ROOT_PASSWORD: "rootsecretpassword123"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: test-app-my-sql
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  namespace: test-app-my-sql
spec:
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: db-secret, key: ROOT_PASSWORD } }
        - name: MYSQL_DATABASE
          valueFrom: { secretKeyRef: { name: db-secret, key: DB_NAME } }
        - name: MYSQL_USER
          valueFrom: { secretKeyRef: { name: db-secret, key: DB_USER } }
        - name: MYSQL_PASSWORD
          valueFrom: { secretKeyRef: { name: db-secret, key: DB_PASSWORD } }
        ports: [{ containerPort: 3306 }]
        volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: mysql-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: test-app-my-sql
spec:
  selector: { app: mysql }
  ports: [{ port: 3306, targetPort: 3306 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: test-app-my-sql
spec:
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
      - name: backend
        image: registry.registry.svc.cluster.local:5000/test-app-my-sql:build-run-ef495
        ports: [{ containerPort: 3001 }]
        env:
        - name: DB_USER
          valueFrom: { secretKeyRef: { name: db-secret, key: DB_USER } }
        - name: DB_PASS
          valueFrom: { secretKeyRef: { name: db-secret, key: DB_PASSWORD } }
        - name: DB_NAME
          valueFrom: { secretKeyRef: { name: db-secret, key: DB_NAME } }
        - name: DB_URI
          value: "mysql://$(DB_USER):$(DB_PASS)@mysql-service:3306/$(DB_NAME)"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: test-app-my-sql
spec:
  selector: { app: backend }
  ports: [{ port: 3001, targetPort: 3001 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: test-app-my-sql
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: test-app-my-sql.barbariska.fun
    http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: backend-service, port: { number: 3001 } } } }] }